# Render Blueprint for the keeper: the public pricer API plus the settler loop in one process
# (src/keeper.js). New > Blueprint > this repo. Set the `sync: false` values in the dashboard:
#   OPERATOR_PRIVATE_KEY   testnet operator key (signs quotes; pays gas for claims)
#   SETTLER_PRIVATE_KEYS   testnet settler keys, comma-separated (demo: all settlers in one process)
#   ALLOWED_ORIGINS        the frontend origin(s), comma-separated
#   GITHUB_EVIDENCE_TOKEN  fine-grained token, Contents read/write on this repo only (registry +
#                          evidence persist on the keeper-data branch across restarts)
services:
  - type: web
    name: arra-pricer
    runtime: node
    rootDir: offchain
    buildCommand: npm ci --omit=dev
    startCommand: node src/keeper.js
    healthCheckPath: /health
    plan: free
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: RPC_URL
        value: https://rpc.testnet.arc.network
      - key: CHAIN_ID
        value: "5042002"
      - key: VAULT_ADDRESS
        value: "0x1D69e0fE014df1007aE66A68a5c9714a7E833d6f"
      - key: MOCK_GEMINI
        value: "false"
      - key: TRUST_PROXY
        value: "1"
      - key: RATE_LIMIT_PER_MIN
        value: "60"
      - key: FROM_BLOCK
        value: "72987227"
      - key: OPERATOR_PRIVATE_KEY
        sync: false
      - key: SETTLER_PRIVATE_KEYS
        sync: false
      - key: GITHUB_EVIDENCE_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
